name: "Nobreak Ragtech"
version: "0.1.1"
slug: "ragtech_ups"
description: "Monitora nobreaks Ragtech ligados via USB e publica os dados no Home Assistant por MQTT"
url: "https://github.com/thelopesbr/ragtech-ups"
arch:
  - aarch64
  - amd64
# A imagem base do Home Assistant já tem o init (S6 overlay)
init: false
# Mapeia as portas seriais do host (o nobreak aparece como /dev/ttyACMx)
uart: true
# Usa o broker do app Mosquitto quando ele estiver rodando (credenciais vêm do Supervisor);
# sem ele, o broker é informado nas opções mqtt_*
services:
  - mqtt:want
options:
  topic: "ragtech_ups/nobreak"
  interval: 5
  ha_discovery: true
  publish_fields: false
schema:
  # Vazio = detecta o nobreak pelo USB
  port: "device(subsystem=tty)?"
  # Potência ativa nominal em W (ex.: 1400 no One Up Nitro 2000); sem ela não há sensor de watts
  nominal_power: "int(1,)?"
  topic: "str"
  interval: "float(1,)"
  ha_discovery: "bool"
  publish_fields: "bool"
  debug: "bool?"
  # Broker manual: se mqtt_host for preenchido, ignora o broker do app Mosquitto
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
