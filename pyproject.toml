[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtech-ups"
version = "0.1.1"
description = "Leitura de nobreaks Ragtech (família NEP/Toro/Innergie/One Up) via USB-serial, com ponte MQTT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thelopesbr" }]
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/thelopesbr/ragtech-ups"

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
ragtech-ups = "ragtech_ups.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
